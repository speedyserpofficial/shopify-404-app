<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install 404 Redirect App</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Shopify 404 Auto Redirect App</h1>
    <p>Click the button below to install the redirect script on your store.</p>
    <button onclick="createScriptTag()">Install on Shopify</button>

    <script>
        async function createScriptTag() {
            const shop = "my-app-test-404.myshopify.com"; // Your store name
            const accessToken = "5c34217fd61e9b188956c90e7f73d5cb-1740169067"; // Your correct access token here
            const scriptUrl = "https://speedyserpofficial.github.io/refactored-dollop/404-redirection.js"; // URL to your JS file
            const apiUrl = `https://${shop}/admin/api/2023-10/script_tags.json`; // Make sure the API version is correct

            try {
                const response = await axios.post(apiUrl, {
                    script_tag: {
                        event: 'onload',
                        src: scriptUrl
                    }
                }, {
                    headers: {
                        'X-Shopify-Access-Token': accessToken,
                        'Content-Type': 'application/json'
                    }
                });

                alert("✅ ScriptTag created successfully!");
                console.log(response.data);
            } catch (error) {
                alert("❌ Error creating ScriptTag. Check the console.");
                // Enhanced error logging
                console.error("❌ Error details:", error.response ? error.response.data : error.message);
            }
        }
    </script>
</body>
</html>
